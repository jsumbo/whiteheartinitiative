# Decap CMS setup for the White Heart Initiative site editor.
# The GitHub connection (backend) is added in app/admin/route.ts from env vars.

# When running on your own computer with `npm run cms`, edits save straight to the local files.
local_backend: true

# Every uploaded photo goes into this one folder.
media_folder: public/uploads
public_folder: /uploads

site_url: /
display_url: /
logo_url: /logo.png
locale: en

editor:
  preview: false

collections:
  - name: pages
    label: Pages and settings
    description: Text that appears on each page, plus your contact details and social links.
    editor: { preview: false }
    files:
      - name: settings
        label: Contact details and social links
        file: content/settings.json
        format: json
        fields:
          - { name: email, label: Email address, widget: string, hint: "Shown on the Contact page. Example: hello@whiteheart.org" }
          - { name: phone, label: Phone or WhatsApp number, widget: string, hint: "Include the country code. Example: +231 77 000 0000" }
          - { name: location, label: Location, widget: string, hint: "Town and county, or a street address. Example: Monrovia, Montserrado County" }
          - { name: handle, label: Social media handle, widget: string, hint: "The name people search for on social media, starting with @." }
          - name: social
            label: Social media links
            widget: object
            collapsed: false
            hint: "Paste the full web address of each page. Leave a box empty to hide that link."
            fields:
              - { name: instagram, label: Instagram link, widget: string, required: false }
              - { name: facebook, label: Facebook link, widget: string, required: false }
              - { name: x, label: X (Twitter) link, widget: string, required: false }
              - { name: linkedin, label: LinkedIn link, widget: string, required: false }
              - { name: tiktok, label: TikTok link, widget: string, required: false }
              - { name: youtube, label: YouTube link, widget: string, required: false }

      - name: home
        label: Home page
        file: content/home.json
        format: json
        fields:
          - { name: headline, label: Main heading, widget: string, hint: "The big heading at the top of the home page." }
          - { name: tagline, label: Tagline, widget: string, hint: "Short line under the heading, shown in italics." }
          - { name: intro, label: Intro line, widget: text, hint: "One or two sentences that say what White Heart Initiative does." }
          - { name: heroImage, label: Top photo, widget: image, choose_url: false, hint: "Large photo behind the heading. Pick a wide photo (landscape). Big files are fine, the site shrinks them." }
          - { name: heroImageAlt, label: Top photo description, widget: string, hint: "Describe what is in the photo for people who cannot see it. Example: Children in school uniform sitting in a classroom." }
          - { name: primaryButton, label: First button text, widget: string, hint: "Takes people to the 'How you can help' section." }
          - { name: secondaryButton, label: Second button text, widget: string, hint: "Takes people to the About page." }
          - { name: ctaTitle, label: Closing section heading, widget: string, hint: "Heading of the section near the bottom that asks people to volunteer or donate. Keep it lowercase to match the style." }
          - { name: ctaText, label: Closing section text, widget: text, hint: "One or two sentences asking people to help." }
          - { name: ctaImage, label: Closing section photo, widget: image, choose_url: false, hint: "Photo behind the closing section. Pick a wide photo." }
          - { name: ctaImageAlt, label: Closing section photo description, widget: string, hint: "Describe what is in the photo." }
          - { name: ctaVolunteerButton, label: Volunteer button text, widget: string, hint: "Opens the contact form with this text already filled in." }
          - { name: ctaDonateButton, label: Donate button text, widget: string, hint: "Opens the contact form with this text already filled in." }

      - name: about
        label: About page
        file: content/about.json
        format: json
        fields:
          - { name: heroImage, label: Top photo, widget: image, choose_url: false, hint: "Photo behind the 'about us.' heading. Pick a wide photo." }
          - { name: heroImageAlt, label: Top photo description, widget: string, hint: "Describe what is in the photo." }
          - { name: heading, label: Greeting, widget: string, required: false, hint: "Optional. Short heading above the about text, for example: Nice to meet you!" }
          - { name: body, label: About text, widget: text, hint: "Who you are and what you do. Also shown on the home page." }
          - { name: quote, label: Founder quote, widget: text, hint: "Type the quote without quotation marks. They are added for you." }
          - { name: quoteBy, label: Quote by, widget: string, hint: "Name of the person who said it." }
          - { name: vision, label: Vision, widget: text, hint: "One sentence. Also shown on the home page." }
          - name: mission
            label: Mission points
            widget: list
            field: { name: point, label: Point, widget: text }
            hint: "Each point shows as its own item. Use 'Add' to add a point. Drag to change the order."
          - { name: goal, label: Goal, widget: text, hint: "The full goal statement." }

      - name: programsPage
        label: Programs page intro
        file: content/programs-page.json
        format: json
        fields:
          - { name: intro, label: Intro text, widget: text, hint: "Shown at the top of the Programs page and on the home page. To change the programs themselves, go to 'Programs' in the menu." }

      - name: galleryPage
        label: Gallery page intro
        file: content/gallery-page.json
        format: json
        fields:
          - { name: intro, label: Intro text, widget: text, hint: "Shown at the top of the Gallery page. To add photos, go to 'Gallery photos' in the menu." }

      - name: contact
        label: Contact page
        file: content/contact.json
        format: json
        fields:
          - { name: heading, label: Heading, widget: string, hint: "Big heading at the top of the page. It is shown in lowercase." }
          - { name: intro, label: Intro text, widget: text, hint: "Shown under the heading. Your social media handle is added at the end for you." }
          - { name: helpIntro, label: "'How you can help' intro", widget: text, hint: "One or two sentences above the list of things you need." }
          - name: helpGroups
            label: "'How you can help' list"
            widget: list
            summary: "{{fields.title}}"
            hint: "Each group is a heading with a list of items or a short sentence. Drag groups to change the order."
            fields:
              - { name: title, label: Group heading, widget: string, hint: "Example: Technology for Learning" }
              - { name: items, label: Items needed, widget: list, required: false, field: { name: item, label: Item, widget: string }, hint: "One item per line. Leave empty if you use the sentence below instead." }
              - { name: text, label: Short sentence, widget: text, required: false, hint: "Optional. Use this for needs that are not a list of items." }
          - name: helpButtons
            label: Buttons under the list
            widget: list
            field: { name: label, label: Button text, widget: string }
            hint: "Each button opens the contact form with its text already filled in."

  - name: programs
    label: Programs
    label_singular: Program
    description: "Each program is shown on the Programs page and the home page. Use 'Display order' to choose which comes first."
    folder: content/programs
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{title}}"
    identifier_field: title
    summary: "{{order}}. {{title}}"
    sortable_fields: [order, title]
    fields:
      - { name: title, label: Program name, widget: string, hint: "Short name, for example Education." }
      - { name: order, label: Display order, widget: number, value_type: int, min: 1, default: 1, hint: "1 shows first, 2 second, and so on." }
      - { name: image, label: Photo, widget: image, choose_url: false, hint: "A photo from this program. Pick a wide photo." }
      - { name: imageAlt, label: Photo description, widget: string, hint: "Describe what is in the photo. Example: A mentor helping two girls with a reading exercise." }
      - { name: description, label: Write-up, widget: text, hint: "A few sentences about what this program does. Leave an empty line between paragraphs. The first paragraph is also shown on the home page." }

  - name: team
    label: Team
    label_singular: Team member
    description: "People shown in the Team section of the About page. Use 'Display order' to choose who comes first."
    folder: content/team
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{name}}"
    identifier_field: name
    summary: "{{name}} ({{position}})"
    sortable_fields: [order, name]
    fields:
      - { name: name, label: Full name, widget: string }
      - { name: position, label: Position, widget: string, hint: "Their role in the organization. Example: Founder, Programme Coordinator." }
      - { name: photo, label: Photo, widget: image, required: false, choose_url: false, hint: "A portrait photo (taller than wide) works best. If empty, their initials are shown instead." }
      - { name: photoAlt, label: Photo description, widget: string, required: false, hint: "Describe the photo. Example: Rashell Scott smiling, wearing a green dress." }
      - { name: order, label: Display order, widget: number, value_type: int, min: 1, default: 1, hint: "1 shows first, 2 second, and so on." }

  - name: gallery
    label: Gallery photos
    label_singular: Photo
    description: "Photos from programme activities. The newest date shows first. The six newest also appear on the home page."
    folder: content/gallery
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}{{second}}"
    identifier_field: alt
    summary: "{{date}}: {{alt}}"
    sortable_fields: [date]
    fields:
      - { name: image, label: Photo, widget: image, choose_url: false, hint: "Upload the photo. Big files are fine, the site shrinks them for phones." }
      - { name: alt, label: Photo description, widget: string, hint: "Not shown on the page. Screen readers read it out to people who cannot see the photo. Example: Children lining up for a health check outside a school." }
      - name: program
        label: Program
        widget: relation
        collection: programs
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
        required: false
        hint: "Optional. Pick the program this photo belongs to so visitors can filter by it."
      - { name: date, label: Date taken, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, hint: "Roughly when the photo was taken. Used to sort the gallery." }
